[package]
name = "sonic262"
version = "0.2.0"
authors = ["Ujjwal Sharma <ryzokuken@disroot.org>"]
edition = "2021"

[dependencies]
walkdir = "2"
yaml-rust2 = "0.9"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
colored = "2"
json = "0.12"
rayon = "1"
crossbeam-channel = "0.5"
wait-timeout = "0.2"
glob = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
